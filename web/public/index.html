<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#20242e">
    <title data-i18n="千星模拟器 · Live Preview">千星模拟器 · Live Preview</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-qxqy-font-ui>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">UI</span>
        <div>
          <strong data-i18n="模拟器">模拟器</strong>
          <span data-i18n="Web Preview · 实时预览">Web Preview · 实时预览</span>
        </div>
      </div>
      <div class="project-picker">
        <label for="archive-select" data-i18n="工作区存档">工作区存档</label>
        <select id="archive-select" aria-label="工作区存档" data-i18n-aria-label="工作区存档"></select>
        <button id="reload-button" class="icon-button" title="重新读取存档" data-i18n-title="重新读取存档" aria-label="重新读取存档" data-i18n-aria-label="重新读取存档">↻</button>
      </div>
      <div class="topbar-status">
        <a href="/editor" style="color:inherit" data-i18n="编辑工作台 ↗">编辑工作台 ↗</a>
        <div id="connection" class="connection"><span></span><span data-i18n="正在连接">正在连接</span></div>
        <button id="theme-button" class="icon-button theme-button" title="切换亮暗主题" data-i18n-title="切换亮暗主题" aria-label="切换亮暗主题" data-i18n-aria-label="切换亮暗主题">◐</button>
      </div>
    </header>

    <main class="app-shell">
      <aside class="tree-panel panel">
        <div class="panel-heading">
          <div>
            <span class="eyebrow">STRUCTURE</span>
            <h2 id="tree-title" data-i18n="控件树">控件树</h2>
          </div>
          <span id="tree-count" class="count">0</span>
        </div>
        <div id="tree" class="tree" role="tree"></div>
      </aside>

      <section class="preview-panel">
        <div class="preview-toolbar panel">
          <div class="segmented" aria-label="预览模式" data-i18n-aria-label="预览模式">
            <button id="mode-editor" class="active" data-mode="editor" data-i18n="编辑器">编辑器</button>
            <button id="mode-play" data-mode="play" data-i18n="试玩">试玩</button>
          </div>
          <label class="select-field">
            <span data-i18n="资产">资产</span>
            <select id="asset-select">
              <option value="server-control-template" data-i18n="服务端 UI">服务端 UI</option>
              <option value="client-control-template" data-i18n="客户端模板">客户端模板</option>
            </select>
          </label>
          <label class="select-field">
            <span data-i18n="设备">设备</span>
            <select id="device-select"></select>
          </label>
          <div class="play-controls" id="play-controls">
            <button id="play-start" class="primary" data-i18n="▶ 启动">▶ 启动</button>
            <button id="play-keys" data-key-input-toggle aria-pressed="true" title="转发官方键位的按下/抬起事件（含鼠标左右键）；关闭不影响画布点击" data-i18n-title="转发官方键位的按下/抬起事件（含鼠标左右键）；关闭不影响画布点击" data-i18n="键位响应：开">键位响应：开</button>
            <button id="play-audio" data-audio-toggle title="点击解锁浏览器音效" data-i18n-title="点击解锁浏览器音效" data-i18n="开启声音">开启声音</button>
            <button id="play-pause" data-i18n="Ⅱ 暂停">Ⅱ 暂停</button>
            <button id="play-resume" data-i18n="▷ 继续">▷ 继续</button>
            <button id="play-step" data-i18n="+ 1 帧">+ 1 帧</button>
            <button id="play-stop" class="danger" data-i18n="■ 停止">■ 停止</button>
          </div>
        </div>

        <div class="workspace panel">
          <div class="stage-meta">
            <div>
              <span id="asset-label" data-i18n="等待存档">等待存档</span>
              <strong id="save-name" data-i18n="未命名存档">未命名存档</strong>
            </div>
            <div class="stage-readout">
              <span id="canvas-label">—</span>
              <span id="revision-label">Revision —</span>
            </div>
          </div>
          <div id="stage-shell" class="stage-shell" tabindex="0" aria-label="模拟器预览画布" data-i18n-aria-label="模拟器预览画布">
            <img id="stage-image" alt="千星模拟器预览">
            <canvas id="stage-canvas" class="stage-canvas" hidden></canvas>
            <div id="stage-empty" class="stage-empty">
              <span>⌁</span>
              <strong data-i18n="等待工作区存档">等待工作区存档</strong>
              <p data-i18n="Codex 保存 qxqy-simulator-save JSON 后会自动出现在这里。">Codex 保存 qxqy-simulator-save JSON 后会自动出现在这里。</p>
            </div>
            <div id="stage-loading" class="stage-loading" hidden data-i18n="正在更新画面…">正在更新画面…</div>
          </div>
          <div class="stage-footer">
            <span id="active-path" data-i18n="尚未打开存档">尚未打开存档</span>
            <span id="play-readout" data-i18n="编辑器静态预览">编辑器静态预览</span>
          </div>
        </div>
      </section>

      <aside class="info-panel panel">
        <div class="panel-heading">
          <div>
            <span class="eyebrow">INSPECT</span>
            <h2 data-i18n="预览信息">预览信息</h2>
          </div>
        </div>
        <section class="info-card">
          <span class="info-label" data-i18n="当前节点">当前节点</span>
          <strong id="node-name" data-i18n="未选择">未选择</strong>
          <dl id="node-details"></dl>
        </section>
        <section class="info-card metrics">
          <div><span data-i18n="控件">控件</span><strong id="metric-controls">0</strong></div>
          <div><span>Lua</span><strong id="metric-scripts">0</strong></div>
          <div><span data-i18n="画布">画布</span><strong id="metric-canvas">—</strong></div>
        </section>
        <section class="log-card">
          <div class="log-heading"><span>Runtime Logs</span><button id="clear-logs" data-i18n="清空">清空</button></div>
          <pre id="runtime-logs" data-i18n="试玩启动后显示 Lua 日志。">试玩启动后显示 Lua 日志。</pre>
        </section>
        <section class="info-card connection-details">
          <span class="info-label" data-i18n="预览连接">预览连接</span>
          <div id="server-version" data-i18n="正在连接服务…">正在连接服务…</div>
          <div id="workspace-path"></div>
          <div id="preview-diagnostics" role="status" aria-live="polite" hidden></div>
        </section>
        <p class="watch-note"><span>●</span><span data-i18n="当前存档保存后自动刷新；首次存档会自动发现。切换其他存档请使用顶部列表或 MCP 预览工具。"> 当前存档保存后自动刷新；首次存档会自动发现。切换其他存档请使用顶部列表或 MCP 预览工具。</span></p>
      </aside>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
