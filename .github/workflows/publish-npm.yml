name: Stage npm packages

on:
  push:
    tags:
      - 'npm-*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare system fonts for rendering tests
        run: |
          node --input-type=module -e "import { GlobalFonts } from '@napi-rs/canvas'; console.log('Initial Canvas font families:', GlobalFonts.families.length)"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fontconfig fonts-dejavu-core fonts-noto-cjk
          fc-cache -f
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createCanvas, GlobalFonts } from '@napi-rs/canvas'
          import { DEFAULT_FONT } from './studio/fonts.js'
          const context = createCanvas(160, 80).getContext('2d')
          context.font = `20px ${DEFAULT_FONT}`
          context.fillText('Line 0', 2, 40)
          assert.ok(context.getImageData(0, 0, 160, 80).data.some((value, index) => index % 4 === 3 && value > 0), 'System fonts must rasterize text before running pixel tests')
          console.log('Ready Canvas font families:', GlobalFonts.families.length)
          NODE
      - name: Test
        run: pnpm test
      - name: Verify Git source installation
        run: pnpm test:git-install
      - name: Build release tarballs
        run: pnpm pack:release
      - name: Verify release tarballs
        run: pnpm test:packages
      - name: Verify Harness 0.2 host integration
        run: pnpm test:harness
      - name: Stage changed versions
        run: node scripts/publish-npm.mjs ${{ startsWith(github.ref_name, 'npm-dsh-') && '--product=dsh-plugin' || startsWith(github.ref_name, 'npm-mcp-') && '--product=mcp' || startsWith(github.ref_name, 'npm-web-') && '--product=web' || '' }}
