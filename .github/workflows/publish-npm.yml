name: Stage npm packages

on:
  push:
    tags:
      - 'npm-*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Verify Git source installation
        run: pnpm test:git-install
      - name: Build release tarballs
        run: pnpm pack:release
      - name: Verify release tarballs
        run: pnpm test:packages
      - name: Stage changed versions
        run: node scripts/publish-npm.mjs
